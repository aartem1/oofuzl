name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The versions the plugin pins, so the tests that run the real tools
      # run here instead of being skipped.
      - run: pip install "lizard==1.23.0" "vulture==2.16"
      - run: npm install --global jscpd@5.4.1 madge@8.0.0
      - run: python -m unittest discover -s tests -t tests
